"[package]\nname = \"bevy_winit\"\nversion = \"0.19.0-dev\"\npublish = false\nedition = \"2024\"\ndescription = \"A winit window and input backend for Bevy Engine\"\nhomepage = \"https://bevy.org\"\nrepository = \"https://github.com/bevyengine/bevy\"\nlicense = \"MIT OR Apache-2.0\"\nkeywords = [\"bevy\"]\n\n[features]\ndefault = [\"x11\"]\ntrace = []\nwayland = [\"winit/wayland\", \"winit/wayland-csd-adwaita\"]\nx11 = [\"winit/x11\"]\naccesskit_unix = [\n  \"accesskit_winit/accesskit_unix\",\n  \"accesskit_winit/async-io\",\n  \"bevy_tasks/async-io\",\n]\n\nserialize = [\n  \"bevy_input/serialize\",\n  \"bevy_window/serialize\",\n  \"bevy_platform/serialize\",\n]\nandroid-native-activity = [\"winit/android-native-activity\"]\nandroid-game-activity = [\"winit/android-game-activity\"]\ncustom_cursor = [\n  \"bevy_window/custom_cursor\",\n  \"bevy_image\",\n  \"bevy_asset\",\n  \"wgpu-types\",\n  \"bytemuck\",\n]\n\n[dependencies]\n# bevy\nbevy_a11y = { path = \"../bevy_a11y\", version = \"0.19.0-dev\" }\nbevy_app = { path = \"../bevy_app\", version = \"0.19.0-dev\" }\nbevy_derive = { path = \"../bevy_derive\", version = \"0.19.0-dev\" }\nbevy_ecs = { path = \"../bevy_ecs\", version = \"0.19.0-dev\" }\nbevy_input = { path = \"../bevy_input\", version = \"0.19.0-dev\" }\nbevy_input_focus = { path = \"../bevy_input_focus\", version = \"0.19.0-dev\" }\nbevy_log = { path = \"../bevy_log\", version = \"0.19.0-dev\" }\nbevy_math = { path = \"../bevy_math\", version = \"0.19.0-dev\" }\nbevy_reflect = { path = \"../bevy_reflect\", version = \"0.19.0-dev\" }\nbevy_window = { path = \"../bevy_window\", version = \"0.19.0-dev\" }\nbevy_tasks = { path = \"../bevy_tasks\", version = \"0.19.0-dev\" }\nbevy_platform = { path = \"../bevy_platform\", version = \"0.19.0-dev\", default-features = false, features = [\n  \"std\",\n] }\n\n# bevy optional\n## used by custom_cursor\nbevy_asset = { path = \"../bevy_asset\", version = \"0.19.0-dev\", optional = true }\n## used by custom_cursor\nbevy_image = { path = \"../bevy_image\", version = \"0.19.0-dev\", optional = true }\n## used by custom_cursor\nwgpu-types = { version = \"29.0.3\", optional = true }\n## used by custom_cursor\nbytemuck = { version = \"1.5\", optional = true }\n\n# other\n# feature rwh_06 refers to window_raw_handle@v0.6\nwinit = { version = \"0.30\", default-features = false, features = [\"rwh_06\"] }\naccesskit_winit = { version = \"0.32\", default-features = false, features = [\n  \"rwh_06\",\n] }\napprox = { version = \"0.5\", default-features = false }\naccesskit = \"0.24\"\ntracing = { version = \"0.1\", default-features = false, features = [\"std\"] }\n\n[target.'cfg(target_os = \"android\")'.dependencies]\nbevy_android = { path = \"../bevy_android\", version = \"0.19.0-dev\", default-features = false }\n\n[target.'cfg(target_arch = \"wasm32\")'.dependencies]\nwasm-bindgen = { version = \"0.2\" }\nweb-sys = \"0.3\"\njs-sys = \"0.3\"\n# TODO: Assuming all wasm builds are for the browser. Require `no_std` support to break assumption.\nbevy_app = { path = \"../bevy_app\", version = \"0.19.0-dev\", default-features = false, features = [\n  \"web\",\n] }\nbevy_platform = { path = \"../bevy_platform\", version = \"0.19.0-dev\", default-features = false, features = [\n  \"web\",\n] }\nbevy_reflect = { path = \"../bevy_reflect\", version = \"0.19.0-dev\", default-features = false, features = [\n  \"web\",\n] }\n\n[lints.clippy]\ndoc_markdown = \"warn\"\nmanual_let_else = \"warn\"\nmatch_same_arms = \"warn\"\nredundant_closure_for_method_calls = \"warn\"\nredundant_else = \"warn\"\nsemicolon_if_nothing_returned = \"warn\"\ntype_complexity = \"allow\"\nundocumented_unsafe_blocks = \"warn\"\nunwrap_or_default = \"warn\"\nneedless_lifetimes = \"allow\"\ntoo_many_arguments = \"allow\"\nnonstandard_macro_braces = \"warn\"\nprint_stdout = \"warn\"\nprint_stderr = \"warn\"\nptr_as_ptr = \"warn\"\nptr_cast_constness = \"warn\"\nref_as_ptr = \"warn\"\ntoo_long_first_doc_paragraph = \"allow\"\nstd_instead_of_core = \"allow\"\nstd_instead_of_alloc = \"warn\"\nalloc_instead_of_core = \"warn\"\nallow_attributes = \"warn\"\nallow_attributes_without_reason = \"warn\"\n\n[lints.rust]\nmissing_docs = \"warn\"\nunexpected_cfgs = { level = \"warn\", check-cfg = ['cfg(docsrs_dep)'] }\nunsafe_code = \"deny\"\nunsafe_op_in_unsafe_fn = \"warn\"\nunused_qualifications = \"warn\"\n\n\n[package.metadata.docs.rs]\nrustdoc-args = [\n  \"-Zunstable-options\",\n  \"--generate-link-to-definition\",\n  \"--generate-macro-expansion\",\n]\nall-features = true\n"
